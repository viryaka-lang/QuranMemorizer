<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Amiri;src:url(amiri-arabic-700-normal.woff2)}


html,body{margin:0;background:transparent}svg{display:block}
</style></head><body><div id="o"></div><script>
const q=new URLSearchParams(location.search);
const S=+q.get('size')||1024, k=+q.get('scale')||1, mono=q.get('mono')==='1', bg=q.get('bg')!=='0';
const text=q.get('text')||'القرآن', font=q.get('font')||'Ruqaa', fs=+q.get('fs')||250, dy=+q.get('dy')||0;
const c=512, R=400*k;
function star(r,rot){ // eight-point star as two squares
  const p=[];for(let i=0;i<16;i++){const rr=i%2?r*0.765:r;const a=(rot+i*22.5-90)*Math.PI/180;p.push((c+rr*Math.cos(a)).toFixed(1)+','+(c+rr*Math.sin(a)).toFixed(1));}return p.join(' ');}
const gold=mono?'#fff':'url(#gold)', ink=mono?'#000':'url(#field)';
let pat='';
if(bg&&!mono){ for(let y=-1;y<9;y++)for(let x=-1;x<9;x++){const cx=x*128+(y%2?64:0),cy=y*128;
  pat+=`<polygon transform="translate(${cx-c},${cy-c})" points="${starAt(cx,cy)}" />`;} }
function starAt(){return star(34,0);}
// small dots ring
let dots='';for(let i=0;i<32;i++){const a=i*11.25*Math.PI/180, r=R*1.07;dots+=`<circle cx="${(c+r*Math.cos(a)).toFixed(1)}" cy="${(c+r*Math.sin(a)).toFixed(1)}" r="${(R*0.014).toFixed(1)}"/>`;}
document.getElementById('o').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}" viewBox="0 0 1024 1024">
<defs>
 <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#2b7d60"/><stop offset=".55" stop-color="#17513f"/><stop offset="1" stop-color="#0a2a21"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7a6"/><stop offset=".45" stop-color="#e2b65a"/><stop offset="1" stop-color="#a8761f"/></linearGradient>
 <radialGradient id="field" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#1e6a50"/><stop offset="1" stop-color="#0d3a2d"/></radialGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="${8*k}" stdDeviation="${12*k}" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
${bg&&!mono?`<rect width="1024" height="1024" fill="url(#bg)"/><g fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="3">${pat}</g>`:''}
<g ${mono?'':'filter="url(#sh)"'}>
 <g fill="${gold}">${dots}</g>
 ${mono?`<polygon points="${star(R*0.95,0)}" fill="none" stroke="#fff" stroke-width="${40*k}" stroke-linejoin="miter"/>`:`<polygon points="${star(R,0)}" fill="${gold}"/>
 <polygon points="${star(R*0.93,0)}" fill="#7a5214" opacity=".35"/>
 <polygon points="${star(R*0.90,0)}" fill="${ink}"/>`}
 <polygon points="${star(R*0.84,0)}" fill="none" stroke="${gold}" stroke-width="${6*k}"/>
 <circle cx="${c}" cy="${c}" r="${R*0.60}" fill="none" stroke="${gold}" stroke-width="${4*k}" opacity="${mono?1:.8}"/>
 <text x="${c}" y="${c+dy*k}" text-anchor="middle" dominant-baseline="central" font-family="${font}" font-size="${fs*k}" fill="${gold}" direction="rtl">${text}</text>
</g></svg>`;
document.fonts.ready.then(()=>document.title='ready');
</script></body></html>
